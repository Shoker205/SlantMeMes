name: Build Android APK

# Когда запускать сборку:
on:
  push:
    branches: [ "main", "master" ] # При пуше в эти ветки
  workflow_dispatch: # Позволяет запускать сборку вручную из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Укажите версию Java, которую использует ваш проект (обычно 11 или 17)
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        # Путь к APK зависит от структуры вашего проекта. Это стандартный путь:
        path: app/build/outputs/apk/debug/*.apk 
        
